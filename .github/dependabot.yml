# Mises à jour de sécurité et de dépendances, regroupées chaque semaine.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
